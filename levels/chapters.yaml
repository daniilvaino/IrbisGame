- number: 1
  title: Первый день в SOC
  description: |
    Вы — новый аналитик центра мониторинга «Стеклянного Маяка». Сегодня утром с файлового сервера проекта «Ирбис»
    утекли чертежи. Пока все бегают по коридорам, ваша задача — научиться смотреть в логи: take, project, where, sort, top.
- number: 2
  title: Считаем
  description: |
    Логов десятки тысяч строк — глазами их не прочесть. Агрегаты сворачивают поток событий в несколько чисел:
    count, summarize, sum/avg/dcount и bin() для временных рядов.
- number: 3
  title: Ищем по тексту
  description: |
    Темы писем, адреса, URL — улики спрятаны в строках. Учимся искать по словам и подстрокам, по шаблонам
    и вытаскивать кусок текста из строки.
- number: 4
  title: Вычисления и время
  description: |
    Новые колонки, условия, относительное время и интервалы. Здесь становится видно, когда именно всё произошло.
- number: 5
  title: Связываем таблицы
  description: |
    Почта, сеть, пропуска и карты живут в разных таблицах. join и union собирают из них одну картину.
- number: 6
  title: Динамические данные
  description: |
    Заголовки писем, вложения, детали платежей лежат в JSON. parse_json, обращение к свойствам и mv-expand
    превращают вложенные структуры в обычные строки и колонки.
- number: 7
  title: Дело «Ирбис»
  description: |
    Финальное расследование. Каждый шаг — запрос из нескольких операторов, объединяющий то, чему вы научились.
    Соберите цепочку: фишинг → украденный пароль → выгрузка → тот, кто всё это оплатил.
