id: 03-where
chapter: 1
order: 3
title: Хозяин сервера
topic: where
engines: [BabyKusto, KustoLoco]
points: 100
theory: |
  `where` пропускает дальше только строки, для которых условие истинно.
  Сравнение: `==`, `!=`, `<`, `>`, `<=`, `>=`; условия объединяются через `and` / `or`.
  Строковое `==` чувствительно к регистру; строки пишутся в двойных кавычках.
example: |
  Employees
  | where Department == "Безопасность" and Floor >= 5
task: |
  Файлы утекли из папки, которую ведёт ведущий инженер проекта — Глеб Штерн.
  Найдите в `Employees` его полную карточку (все колонки).
hints:
  - |-
    Отфильтруйте таблицу по колонке `Name`.
  - |-
    `Employees | where Name == "..."` — имя и фамилия через пробел.
solution: |
  Employees
  | where Name == "Глеб Штерн"
