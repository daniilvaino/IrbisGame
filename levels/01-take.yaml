id: 01-take
chapter: 1
order: 1
title: Первый взгляд
topic: take
engines: [BabyKusto, KustoLoco]
points: 100
theory: |
  Запрос KQL начинается с имени таблицы, дальше данные текут по конвейеру через символ `|`.
  Оператор `take N` (синоним — `limit N`) возвращает N произвольных строк: это самый быстрый способ понять,
  какие в таблице колонки и как выглядят значения.
  Порядок строк при `take` не гарантирован — для «первых» строк нужна сортировка.
example: |
  BadgeEvents
  | take 5
task: |
  Начальник смены прислал доступ к почтовому шлюзу. Посмотрите на любые 10 писем из таблицы `EmailEvents`,
  чтобы понять, что там хранится.
hints:
  - |-
    Имя таблицы — `EmailEvents`, нужен оператор, который берёт N строк.
  - |-
    Шаблон: `ИмяТаблицы | take число`.
solution: |
  EmailEvents
  | take 10
check:
  mode: shape
