id: 18-ago
chapter: 4
order: 4
title: Последние трое суток
topic: ago()
engines: [BabyKusto, KustoLoco]
points: 100
theory: |
  `now()` — текущий момент, `ago(3d)` — момент три дня назад; это обычная datetime-константа.
  Литералы интервалов: `30s`, `15m`, `6h`, `3d`. Классический фильтр «за последние сутки»: `where Timestamp > ago(1d)`.
  Данные мира создаются при запуске сервера, а `ago()` отсчитывает интервал от текущего момента.
  Если сервер давно не перезапускался или дата мира задана вручную, последние трое суток могут содержать мало событий или оказаться пустыми.
example: |
  NetworkLogs
  | where Timestamp > ago(1d) and Action == "blocked"
  | count
task: |
  В таблице `BadgeEvents` найдите события отказа (`Result == "denied"`),
  для которых `Timestamp > ago(3d)`, и посчитайте число таких событий для каждого `EmployeeId`.
  Выведите `EmployeeId` и число отказов; сотрудников без отказов в этом интервале выводить не нужно.
  Здесь три суток отсчитываются от текущего момента выполнения запроса, а не от полуночи даты мира.
hints:
  - |-
    Два условия в `where`: время позже `ago(3d)` и результат прохода.
  - |-
    `BadgeEvents | where Timestamp > ago(3d) and Result == "denied" | summarize Denied = count() by EmployeeId`
solution: |
  BadgeEvents
  | where Timestamp > ago(3d) and Result == "denied"
  | summarize Denied = count() by EmployeeId
