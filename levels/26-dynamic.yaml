id: 26-dynamic
chapter: 6
order: 2
title: Счета за серверы
topic: dynamic-свойства
engines: [KustoLoco]
points: 120
theory: |
  Колонка типа dynamic (`Transactions.Details`) уже хранит JSON — `parse_json` не нужен, свойства доступны сразу:
  `Details.geo.city`, `Details.invoice.ip`. Несуществующее свойство даёт пустое значение, а не ошибку.
  `tostring()` / `tolong()` приводят dynamic к обычным типам.
  BabyKusto умеет обращаться к свойствам, но `tostring()` возвращает строку вместе с JSON-кавычками.
example: |
  Transactions
  | where tostring(Details.geo.country) != "RU"
  | project Merchant, Country = tostring(Details.geo.country), Channel = tostring(Details.channel)
  | take 10
task: |
  В таблице `Transactions` выберите все операции с `Merchant == "CloudNest VPS"`.
  Выведите только `Timestamp`, `EmployeeId`, `Ip` из `Details.invoice.ip` и `Plan` из `Details.invoice.plan`.
  Значения `Ip` и `Plan` приведите к типу string через `tostring()`: прямое чтение свойства сохраняет тип dynamic.
  Порядок строк не важен.
hints:
  - |-
    `Transactions | where Merchant == "CloudNest VPS"` — и дальше `project` со свойствами `Details.invoice...`.
  - |-
    `project Timestamp, EmployeeId, Ip = tostring(Details.invoice.ip), Plan = tostring(Details.invoice.plan)`
solution: |
  Transactions
  | where Merchant == "CloudNest VPS"
  | project Timestamp, EmployeeId, Ip = tostring(Details.invoice.ip), Plan = tostring(Details.invoice.plan)
