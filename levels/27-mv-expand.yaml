id: 27-mv-expand
chapter: 6
order: 3
title: Что ушло во вложениях
topic: mv-expand
engines: [KustoLoco]
points: 140
theory: |
  `mv-expand Колонка` разворачивает массив: строка с массивом из трёх элементов превращается в три строки,
  в каждой — один элемент. Элементу можно дать имя: `mv-expand File = Attachments`.
  Пустой массив строк не даёт. После разворота элемент и его свойства имеют тип dynamic: `File.name`.
  Для строковой колонки с именем файла используйте `tostring(File.name)`.
  BabyKusto `mv-expand` не реализует.
example: |
  EmailEvents
  | where HasAttachment
  | take 3
  | mv-expand File = Attachments
  | project MessageId, Name = tostring(File.name), Size = tolong(File.size)
task: |
  В таблице `EmailEvents` выберите исходящие письма (`Direction == "Outbound"`) и разверните массив вложений `Attachments`.
  Найдите вложения, в имени которых есть подстрока `irbis` без учёта регистра. Ищите именно в свойстве `name`, а не во всём объекте вложения.
  Выведите только `Timestamp`, `Sender`, `Recipient`, `FileName`: по одной строке на подходящее вложение.
  Колонка `FileName` должна иметь тип string — приведите имя файла через `tostring()`. Порядок строк не важен.
hints:
  - |-
    После `mv-expand File = Attachments` добавьте `extend FileName = tostring(File.name)` и фильтр `contains "irbis"`.
  - |-
    `EmailEvents | where Direction == "Outbound" and HasAttachment | mv-expand File = Attachments | ...`
solution: |
  EmailEvents
  | where Direction == "Outbound" and HasAttachment
  | mv-expand File = Attachments
  | extend FileName = tostring(File.name)
  | where FileName contains "irbis"
  | project Timestamp, Sender, Recipient, FileName
