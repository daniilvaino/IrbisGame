id: 30-case-payer
chapter: 7
order: 3
title: "Шаг 3: кто платил"
topic: расследование
engines: [KustoLoco]
points: 250
theory: |
  Инфраструктура атакующего стоит денег. Если её оплатили корпоративной картой, в деталях платежа останется след.
  Сравнивать dynamic-свойство со строкой нужно через `tostring()`.
example: |
  Transactions
  | where Category == "ПО и подписки"
  | project Timestamp, EmployeeId, Merchant, Service = tostring(Details.invoice.service)
  | take 10
task: |
  В таблице `Transactions` найдите оплату сервера с адресом `198.51.100.23` (свойство `Details.invoice.ip`).
  По `EmployeeId` определите имя сотрудника из таблицы `Employees`.
  Ответ — одна строка с одной колонкой: имя сотрудника. Дополнительные колонки выводить не нужно.
  Дополнительно, без проверки: посмотрите остальные покупки этого сотрудника перед арендой сервера.
hints:
  - |-
    Фильтр: `tostring(Details.invoice.ip) == "198.51.100.23"`.
  - |-
    Затем `join kind=inner Employees on EmployeeId | project Name`.
solution: |
  Transactions
  | where tostring(Details.invoice.ip) == "198.51.100.23"
  | join kind=inner Employees on EmployeeId
  | project Name
check:
  mode: scalar
