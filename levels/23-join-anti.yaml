id: 23-join-anti
chapter: 5
order: 3
title: Невидимки
topic: join kind=leftanti
engines: [BabyKusto, KustoLoco]
points: 120
theory: |
  `kind=leftanti` возвращает строки левой таблицы, для которых справа НЕТ ни одной пары — «кого нет в списке».
  `leftanti` возвращает только колонки левой таблицы. Зеркальный вариант — `rightanti`: он возвращает строки и колонки правой таблицы, для которых нет пары слева.
example: |
  Employees
  | where Department == "Финансы"
  | join kind=leftanti Transactions on EmployeeId
  | count
task: |
  В таблице `Employees` найдите подрядчиков (`IsContractor == true`) московского офиса (`Office == "Москва"`),
  у которых нет ни одной записи в `BadgeEvents` за весь представленный в этой таблице период.
  Любая запись, включая отказ, означает, что событие использования пропуска было. Дополнительный фильтр по времени не нужен.
  Выведите только `EmployeeId`, `Name`, `Department`. Порядок строк не важен.
hints:
  - |-
    Слева — московские подрядчики, справа — `BadgeEvents`, вид соединения — `leftanti`.
  - |-
    `Employees | where IsContractor and Office == "Москва" | join kind=leftanti BadgeEvents on EmployeeId | project ...`
solution: |
  Employees
  | where IsContractor and Office == "Москва"
  | join kind=leftanti BadgeEvents on EmployeeId
  | project EmployeeId, Name, Department
